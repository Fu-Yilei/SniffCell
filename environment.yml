name: sniffcell
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # Python
  - python>=3.10

  # Core bioinformatics tools (bioconda / conda-forge)
  - sniffles>=2.7
  - bcftools>=1.20
  - htslib>=1.20          # provides tabix and bgzip
  - samtools>=1.20
  - truvari>=5.4
  - severus>=1.6

  # Python library deps for sniffcell
  - numpy
  - scipy
  - pandas
  - pysam
  - matplotlib
  - seaborn
  - scikit-learn
  - tqdm
  - pip

  - pip:
      - tdb
      - -e .                # install the checked-out repo into this env

# ---------------------------------------------------------------------------
# Tools that require manual installation (not available via conda/bioconda):
# ---------------------------------------------------------------------------
#
# 1. kanpig (Rust binary - download prebuilt release from GitHub)
#    https://github.com/ACEnglish/kanpig/releases
#    Extract and add to PATH, or pass via --kanpig-bin.
#
# 2. modkit (ONT binary)
#    https://github.com/nanoporetech/modkit/releases
#    Extract and add to PATH, or pass via --modkit-bin.
#
# 3. tdb (tandem repeat database tool - pip)
#    pip install tdb
#    Or pass via --tdb-bin.
#
# 4. medaka (tandem repeat calling requires a separate conda env due to
#    TensorFlow dependency conflicts)
#    micromamba create -n medaka -c bioconda medaka>=2.1
#    Then pass via --medaka-bin /path/to/medaka_env/bin/medaka
#
# 5. clair3 (germline SNV/indel caller - requires its own conda env)
#    micromamba create -n clair3 -c bioconda clair3
#    Then pass via --clair3-bin /path/to/clair3_env/bin/run_clair3.sh
#    Also requires --clair3-model-path pointing to a model directory.
#    Models can be downloaded from:
#    https://github.com/HKU-BAL/Clair3#pre-trained-models
#    Example: r1041_e82_400bps_sup_v500 for ONT R10.4.1 sup chemistry.
#
# 6. ClairS (somatic SNV caller - requires its own conda env)
#    Follow installation at: https://github.com/HKU-BAL/ClairS
#    Then pass via --clairs-bin /path/to/clairs_env/bin/run_clairs
#    Platform strings: ont_r10_dorado_sup_5khz, ont_r10_dorado_sup_4khz,
#                      hifi_revio, ilmn, etc.
