<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730">
  <defs>
    <style>
      .title   { font: 700 22px sans-serif; fill: #1f2937; }
      .label   { font: 700 13px sans-serif; fill: #111827; }
      .text    { font: 500 12px monospace; fill: #374151; }
      .subtext { font: 400 11px sans-serif; fill: #6b7280; font-style: italic; }
      .legend  { font: 500 12px sans-serif; fill: #374151; }

      /* Root node */
      .root  { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }

      /* Regular output box */
      .box   { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; }

      /* Optional step (dashed, amber tint) */
      .opt   { fill: #fffbeb; stroke: #d97706; stroke-width: 2; stroke-dasharray: 7 4; }

      /* report/ sub-directory (green tint) */
      .rpt   { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; }

      /* Connector lines */
      .line     { stroke: #94a3b8; stroke-width: 1.8; fill: none; }
      .line-opt { stroke: #d97706; stroke-width: 1.8; stroke-dasharray: 6 4; fill: none; }
    </style>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="1280" height="730" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="38" class="title" text-anchor="middle">Expected Output Layout (Example)</text>

  <!-- ================================================================ -->
  <!-- ROOT NODE: out/full_run/  (centered at x=640)                    -->
  <!-- ================================================================ -->
  <rect x="490" y="56" width="300" height="42" rx="10" class="root"/>
  <text x="640" y="82" class="label" text-anchor="middle">out/full_run/</text>

  <!-- Vertical stem from root down to rail at y=134 -->
  <line x1="640" y1="98" x2="640" y2="134" class="line"/>

  <!-- Horizontal rail at y=134: x from 108 to 1100 -->
  <line x1="108" y1="134" x2="1100" y2="134" class="line"/>

  <!-- Column x-centers: 108, 300, 530, 760, 1000 (adjusted for 5 cols) -->
  <!-- Vertical drops from rail to each top-level box top at y=152 -->
  <line x1="108"  y1="134" x2="108"  y2="152" class="line"/>
  <line x1="300"  y1="134" x2="300"  y2="152" class="line-opt"/>
  <line x1="530"  y1="134" x2="530"  y2="152" class="line"/>
  <line x1="780"  y1="134" x2="780"  y2="152" class="line"/>
  <line x1="1020" y1="134" x2="1020" y2="152" class="line"/>

  <!-- ================================================================ -->
  <!-- COL 1 (center x=108): find outputs                               -->
  <!-- ================================================================ -->
  <rect x="14" y="152" width="188" height="72" rx="8" class="box"/>
  <text x="26" y="173" class="label">find outputs</text>
  <text x="26" y="193" class="text">pbmc_ctdmr.tsv</text>
  <text x="26" y="210" class="text">pbmc_ctdmr.tsv.igv.bed</text>

  <!-- ================================================================ -->
  <!-- COL 2 (center x=300): sv_discovery/ (OPTIONAL, dashed)           -->
  <!-- ================================================================ -->
  <rect x="196" y="152" width="222" height="130" rx="8" class="opt"/>
  <text x="212" y="173" class="label">sv_discovery/</text>
  <text x="212" y="189" class="subtext">(optional step)</text>
  <text x="212" y="209" class="text">tr/</text>
  <text x="212" y="224" style="font: 500 10px monospace; fill: #374151;">  sniffles.tr.confident.vcf.gz</text>
  <text x="212" y="239" class="text">non_tr/</text>
  <text x="212" y="254" style="font: 500 10px monospace; fill: #374151;">  sniffles.nontr.confident.vcf.gz</text>
  <text x="212" y="269" style="font: 500 10px monospace; fill: #374151;">merged/sniffles.confident.</text>
  <text x="212" y="282" style="font: 500 10px monospace; fill: #374151;">  merged.vcf.gz</text>

  <!-- ================================================================ -->
  <!-- COL 3 (center x=530): anno/                                      -->
  <!-- ================================================================ -->
  <rect x="430" y="152" width="200" height="188" rx="8" class="box"/>
  <text x="442" y="173" class="label">anno/</text>
  <text x="442" y="193" class="text">reads_classification.tsv</text>
  <text x="442" y="208" class="text">blocks_classification.tsv</text>
  <text x="442" y="223" class="text">sv_assignment.tsv</text>
  <text x="442" y="238" class="text">sv_assignment_readable.tsv</text>
  <text x="442" y="253" class="text">sv_assignment_readable_long.tsv</text>
  <text x="442" y="268" class="text">anno_run_manifest.json</text>
  <!-- divider before sub-dir indicator -->
  <line x1="442" y1="278" x2="622" y2="278" class="line"/>
  <text x="442" y="296" class="text">├── report/  →  see below</text>

  <!-- Connector from anno/ box bottom-center down to report/ box -->
  <line x1="530" y1="340" x2="530" y2="368" class="line"/>

  <!-- report/ sub-box -->
  <rect x="430" y="368" width="200" height="116" rx="8" class="rpt"/>
  <text x="442" y="388" class="label">anno/report/</text>
  <text x="442" y="406" class="text">index.html</text>
  <text x="442" y="421" class="text">high_confidence_sv.tsv</text>
  <!-- inner divider -->
  <line x1="442" y1="431" x2="622" y2="431" class="line"/>
  <text x="442" y="449" class="text">figures/  (optional)</text>
  <text x="442" y="464" class="text">  &lt;sv_id&gt;.viz.png</text>

  <!-- ================================================================ -->
  <!-- COL 4 (center x=780): figures/  (viz command output)             -->
  <!-- ================================================================ -->
  <rect x="650" y="152" width="260" height="156" rx="8" class="box"/>
  <text x="662" y="173" class="label">figures/</text>
  <text x="662" y="189" class="subtext">(viz command output)</text>
  <text x="662" y="210" class="text">&lt;sv&gt;.png</text>
  <text x="662" y="225" class="text">&lt;sv&gt;.summary.tsv</text>
  <text x="662" y="240" style="font: 500 11px monospace; fill: #374151;">&lt;sv&gt;.supporting_reads_assignment.tsv</text>
  <text x="662" y="255" class="text">&lt;sv&gt;.supporting_reads_ctdmr</text>
  <text x="662" y="270" class="text">  _methylation.tsv</text>

  <!-- ================================================================ -->
  <!-- COL 5 (center x=1020): dmsv/  (dmsv command output)             -->
  <!-- ================================================================ -->
  <rect x="920" y="152" width="196" height="100" rx="8" class="box"/>
  <text x="932" y="173" class="label">dmsv/</text>
  <text x="932" y="189" class="subtext">(dmsv command output)</text>
  <text x="932" y="210" class="text">significant_SVs.tsv</text>
  <text x="932" y="225" class="text">sv_details/</text>
  <text x="932" y="240" class="text">  &lt;sv_id&gt;.tsv.gz</text>

  <!-- ================================================================ -->
  <!-- LEGEND                                                            -->
  <!-- ================================================================ -->
  <!-- separator line -->
  <line x1="16" y1="610" x2="1264" y2="610" stroke="#e5e7eb" stroke-width="1"/>

  <!-- swatch 1: regular box -->
  <rect x="28" y="622" width="22" height="16" rx="3" class="box"/>
  <text x="56" y="634" class="legend">Regular output directory</text>

  <!-- swatch 2: optional (dashed amber) -->
  <rect x="246" y="622" width="22" height="16" rx="3" class="opt"/>
  <text x="274" y="634" class="legend">Optional step (dashed border)</text>

  <!-- swatch 3: report sub-dir (green) -->
  <rect x="480" y="622" width="22" height="16" rx="3" class="rpt"/>
  <text x="508" y="634" class="legend">Sub-directory produced by the report command</text>

  <!-- notes -->
  <text x="28" y="662" class="subtext">Note: figures/ and dmsv/ are siblings of anno/ under out/full_run/ — they are NOT nested inside anno/.</text>
  <text x="28" y="678" class="subtext">sv_discovery/ is optional; run sniffcell-discover-sv before anno if you need de-novo SV calls.</text>
  <text x="28" y="694" class="subtext">anno/report/ is produced by the report command; anno/report/figures/ is only populated when --with_figures is passed.</text>
</svg>
