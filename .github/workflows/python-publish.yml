name: Publish to PyPI, GHCR, and GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Validate release version and classify prerelease
        id: release
        run: |
          python - <<'PYVERSION'
          import ast, configparser, os
          from pathlib import Path
          from packaging.version import Version
          config = configparser.ConfigParser()
          config.read("setup.cfg")
          package_version = Version(config["metadata"]["version"])
          tag_version = Version(os.environ["GITHUB_REF_NAME"].removeprefix("v"))
          module = ast.parse(Path("src/sniffcell/__init__.py").read_text())
          source_version = next(ast.literal_eval(node.value) for node in module.body
                                if isinstance(node, ast.Assign)
                                and any(isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets))
          assert tag_version == package_version == Version(source_version), "Tag and package versions differ"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"prerelease={str(tag_version.is_prerelease).lower()}\n")
          PYVERSION

      - name: Build sdist and wheel
        run: python -m build

      - name: Check dist metadata
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/sniffcell/
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  docker:
    name: Build & Push Docker (GHCR)
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from release tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Compute image name (lowercase)
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER}/sniffcell" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ${{ steps.img.outputs.IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ needs.build.outputs.prerelease == 'false' && format('{0}:latest', steps.img.outputs.IMAGE) || '' }}

  github_release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select version-specific release notes
        id: notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          fi

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Create release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SniffCell ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            dist/*
